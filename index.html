<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>태블릿 자료</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#abc1d1">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#abc1d1;--bar:#9bb3c4;--bubble:#fff;--ink:#222;--sub:#556;--accent:#fae100}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bar)}
#top h1{margin:0;font-size:18px;flex:1}
button{font:inherit;border:0;border-radius:18px;padding:8px 14px;background:#fff;color:var(--ink)}
button.primary{background:var(--accent)}
#status{padding:6px 14px;font-size:13px;color:var(--sub)}
#list{padding:6px 12px 80px}
.date{margin:16px auto 8px;width:max-content;padding:4px 14px;border-radius:14px;background:rgba(0,0,0,.18);color:#fff;font-size:12px}
.msg{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
.avatar{width:38px;height:38px;border-radius:14px;background:#7d98ad;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.col{min-width:0;max-width:min(78%,560px)}
.who{font-size:12px;color:#334;margin:0 0 3px 2px}
.row{display:flex;align-items:flex-end;gap:6px}
.bubble{background:var(--bubble);border-radius:4px 14px 14px 14px;padding:10px 12px;min-width:150px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bubble:active{filter:brightness(.93)}
.fname{font-size:15px;font-weight:600;word-break:break-all}
.meta{font-size:12px;color:var(--sub);margin-top:4px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;margin-left:6px}
.ok{background:#d9f2d9;color:#176b17}
.no{background:#eee;color:#666}
.time{font-size:11px;color:#445;flex:none}
.msg.me{flex-direction:row-reverse}
.msg.me .row{flex-direction:row-reverse}
.msg.me .bubble{background:var(--accent);border-radius:14px 4px 14px 14px}
.msg.me .col{display:flex;flex-direction:column;align-items:flex-end}
.bubble.text{cursor:default;min-width:0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.bubble.gone{opacity:.6;cursor:default}
.sysmsg{margin:10px auto;max-width:90%;text-align:center;font-size:12px;color:#fff;background:rgba(0,0,0,.14);padding:5px 12px;border-radius:12px}
#login{margin:40px auto;max-width:420px;text-align:center;padding:0 20px}
#viewer{position:fixed;inset:0;background:#111;z-index:20;display:none;flex-direction:column}
#viewer.on{display:flex}
#vbar{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#222;color:#fff}
#vtitle{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center}
#vbody canvas{display:block;margin:0 auto 8px;max-width:100%;background:#fff}
#vbody img,#vbody video{max-width:100%;max-height:100%}
#vbody .other{color:#fff;padding:40px 20px}
a.dl{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:20px;background:var(--accent);color:#111;text-decoration:none}
</style>
</head>
<body>
<div id="top">
  <h1>태블릿 자료</h1>
  <button id="btnAll" class="primary" style="display:none">새 파일 모두 받기</button>
  <button id="btnRef" style="display:none">새로고침</button>
</div>
<div id="status"></div>
<div id="login" style="display:none">
  <p>구글 계정으로 로그인하면 드라이브의 <b>태블릿자료</b> 폴더가 카톡처럼 보입니다.</p>
  <button id="btnLogin" class="primary">구글로 로그인</button>
</div>
<div id="list"></div>
<div id="viewer">
  <div id="vbar"><button id="vclose">닫기</button><div id="vtitle"></div></div>
  <div id="vbody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID='295721508542-9t99o38p451rph28b1bf83u1ibi3hrq3.apps.googleusercontent.com';
const ROOT_NAMES=['태블릿 자료','태블릿자료']; // 띄어쓰기 유무 둘 다 허용
// 이 시각 이전의 대화·파일은 목록에 보이지 않는다(테스트 기록을 치우고 새로 시작하기 위한 기준). 바꾸려면 이 줄만 고친다.
const CUTOFF=new Date('2026-10-15T12:50:00+09:00').getTime();
const SCOPE='https://www.googleapis.com/auth/drive.readonly';
const MAX_AUTO=150*1024*1024; // 모두 받기에서 건너뛸 큰 파일
const $=s=>document.querySelector(s);
let token=null, tokenExp=0, tc=null, files=[], saved={}; // saved[id]=mtime
let chatFolders=[], chatMsgs=[];

// ---------- 저장소(IndexedDB): 받아 둔 파일 ----------
const DB=()=>new Promise((res,rej)=>{const q=indexedDB.open('ka_viewer',1);q.onupgradeneeded=()=>q.result.createObjectStore('blobs');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
async function dbGet(k){const d=await DB();return new Promise((res,rej)=>{const r=d.transaction('blobs').objectStore('blobs').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbPut(k,v){const d=await DB();return new Promise((res,rej)=>{const t=d.transaction('blobs','readwrite');t.objectStore('blobs').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbKeys(){const d=await DB();return new Promise((res,rej)=>{const r=d.transaction('blobs').objectStore('blobs').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

const setStatus=t=>{$('#status').textContent=t||''};
const sizeText=n=>{n=+n;if(!n)return'';return n<1048576?(n/1024).toFixed(0)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB'};

// ---------- 로그인 ----------
function loadToken(){try{const t=JSON.parse(localStorage.getItem('ka_tok')||'null');if(t&&t.exp>Date.now()+60000){token=t.tok;tokenExp=t.exp;return true}}catch(e){}return false}
function initAuth(){
  if(!window.google||!google.accounts)return false;
  tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>{
    if(r.error){setStatus('로그인 실패: '+r.error);$('#login').style.display='block';return}
    token=r.access_token;tokenExp=Date.now()+(r.expires_in||3600)*1000;
    try{localStorage.setItem('ka_tok',JSON.stringify({tok:token,exp:tokenExp}));localStorage.setItem('ka_signed','1')}catch(e){}
    $('#login').style.display='none';refresh();
  },error_callback:e=>{ // 조용한 재로그인이 팝업 차단 등으로 안 될 때: 버튼을 눌러 한 번에 다시 연결
    $('#login').style.display='block';
    setStatus('저장된 파일은 그대로 열 수 있습니다. 새 목록을 받으려면 아래 버튼을 한 번 눌러 주세요.');
  }});
  return true;
}
$('#btnLogin').onclick=()=>{if(tc||initAuth())tc.requestAccessToken({})};

// ---------- 드라이브 ----------
async function api(path,params){
  const u=new URL('https://www.googleapis.com/drive/v3/'+path);
  for(const k in params)u.searchParams.set(k,params[k]);
  const r=await fetch(u,{headers:{Authorization:'Bearer '+token}});
  if(r.status===401){token=null;localStorage.removeItem('ka_tok');throw new Error('auth')}
  if(!r.ok)throw new Error('api '+r.status);
  return r;
}
async function children(id){
  let out=[],pt='';
  do{
    const p={q:`'${id}' in parents and trashed=false`,pageSize:1000,orderBy:'createdTime',
      fields:'nextPageToken,files(id,name,mimeType,size,createdTime,modifiedTime)'};
    if(pt)p.pageToken=pt;
    const j=await (await api('files',p)).json();
    out=out.concat(j.files||[]);pt=j.nextPageToken||'';
  }while(pt);
  return out;
}
async function collect(id,path,depth,acc){
  // 같은 단계의 폴더는 동시에 읽는다(한 개씩 기다리면 폴더가 많을 때 오래 걸림)
  await Promise.all((await children(id)).map(async f=>{
    if(f.mimeType==='application/vnd.google-apps.folder'){
      // kakaochats 폴더는 파일 목록에 넣지 않고, 대화 기록(txt) 읽기에만 쓴다
      if(f.name.toLowerCase()==='kakaochats'){chatFolders.push(f.id);return}
      if(depth<4)await collect(f.id,path?path+' / '+f.name:f.name,depth+1,acc)
    }
    else{f.path=path;acc.push(f)}
  }));
}

// ---------- 대화 기록(카톡 '대화 내용 내보내기' txt) ----------
const SELF_NAMES=['한국시각학습지원센터']; // 이 폰 주인(오른쪽 노란 말풍선으로 표시)
function parseChat(txt,room){
  const out=[],rx=/^(\d{4})년 (\d+)월 (\d+)일 (오전|오후) (\d+):(\d+), (.*)$/;
  let last=0;
  txt.replace(/^﻿/,'').split(/\r?\n/).forEach((line,i)=>{
    if(i===0||!line.trim()||line.startsWith('저장한 날짜'))return;
    const m=rx.exec(line);
    if(!m){
      if(line.startsWith('메시지가 삭제되었습니다')){out.push({t:last,kind:'sys',text:line.trim(),room})}
      else if(out.length&&out[out.length-1].kind==='text'&&!/^\d{4}년 /.test(line)){out[out.length-1].text+='\n'+line} // 여러 줄 메시지
      return;
    }
    const h=(+m[5])%12+(m[4]==='오후'?12:0);
    last=new Date(+m[1],+m[2]-1,+m[3],h,+m[6]).getTime();
    const rest=m[7],p=rest.indexOf(' : ');
    if(p<0){out.push({t:last,kind:'sys',text:rest,room});return}
    const sender=rest.slice(0,p),text=rest.slice(p+3);
    if(text.startsWith('파일: '))out.push({t:last,kind:'file',sender,name:text.slice(4),room});
    else out.push({t:last,kind:'text',sender,text,room});
  });
  return out;
}
async function loadChats(){
  // 대화 기록 txt는 바뀌었을 때만 새로 받는다(수정 시각이 같으면 저장해 둔 글을 그대로 씀)
  let cache={};try{cache=JSON.parse(localStorage.getItem('ka_txt')||'{}')}catch(e){}
  const jobs=[];
  for(const id of chatFolders)for(const f of await children(id))if(/\.txt$/i.test(f.name))jobs.push(f);
  const all=(await Promise.all(jobs.map(async f=>{
    let c=cache[f.id];
    if(!c||c.mod!==f.modifiedTime){
      const t=await (await api(`files/${f.id}`,{alt:'media'})).text();
      c={mod:f.modifiedTime,text:t};cache[f.id]=c;
    }
    return parseChat(c.text,f.name.replace(/\.txt$/i,''));
  }))).flat();
  // 드라이브에서 사라진 파일의 저장분은 지운다
  const live=new Set(jobs.map(f=>f.id));for(const k of Object.keys(cache))if(!live.has(k))delete cache[k];
  try{localStorage.setItem('ka_txt',JSON.stringify(cache))}catch(e){}
  chatMsgs=all;
  try{localStorage.setItem('ka_chat',JSON.stringify(chatMsgs))}catch(e){}
}
async function refresh(){
  setStatus('목록 불러오는 중…');
  try{
    const roots=(await (await api('files',{q:`(${ROOT_NAMES.map(n=>`name='${n}'`).join(' or ')}) and mimeType='application/vnd.google-apps.folder' and trashed=false`,fields:'files(id,name)'})).json()).files||[];
    if(!roots.length){setStatus(`드라이브에서 '${ROOT_NAMES[0]}' 폴더를 찾지 못했습니다.`);return}
    const acc=[];chatFolders=[];for(const r of roots)await collect(r.id,'',0,acc);
    acc.sort((a,b)=>new Date(a.createdTime)-new Date(b.createdTime));
    files=acc;
    try{localStorage.setItem('ka_list',JSON.stringify(files))}catch(e){}
    // 파일 목록이 준비되면 먼저 화면에 그린다(대화 기록은 뒤에서 이어서 붙는다)
    setStatus('대화 기록 불러오는 중…');
    await render();
    try{await loadChats();await render()}catch(e){if(e.message==='auth')throw e;setStatus('대화 기록을 읽지 못했습니다.');}
    if(!$('#status').textContent)setStatus('');
  }catch(e){
    if(e.message==='auth'){setStatus('로그인이 만료되었습니다. 다시 로그인하세요.');$('#login').style.display='block';return}
    setStatus('목록을 불러오지 못했습니다(오프라인?). 저장된 목록을 보여줍니다.');
    try{files=JSON.parse(localStorage.getItem('ka_list')||'[]')}catch(_){files=[]}
    try{chatMsgs=JSON.parse(localStorage.getItem('ka_chat')||'[]')}catch(_){chatMsgs=[]}
  }
  await render();
}

// ---------- 그리기 ----------
const ICON=n=>{n=n.toLowerCase();return /\.pdf$/.test(n)?'📕':/\.(jpe?g|png|gif|webp|heic)$/.test(n)?'🖼️':/\.(mp4|mov|m4v|webm)$/.test(n)?'🎞️':/\.(hwp|hwpx)$/.test(n)?'📄':/\.(docx?|xlsx?|pptx?)$/.test(n)?'📘':'📎'};
async function loadSaved(){saved={};for(const k of await dbKeys()){const v=await dbGet(k);if(v)saved[k]=v.mtime}}
let firstRender=true;
async function render(){
  await loadSaved();
  files=files.filter(f=>new Date(f.createdTime).getTime()>=CUTOFF);
  chatMsgs=chatMsgs.filter(m=>m.t>=CUTOFF);
  // 자동 새로고침 때 보던 위치를 뺏지 않도록: 처음이거나 맨 아래 근처에 있을 때만 맨 아래로 이동
  const nearBottom=firstRender||(window.innerHeight+window.scrollY>=document.body.scrollHeight-300),keepY=window.scrollY;
  const L=$('#list');L.innerHTML='';
  // 대화 기록과 드라이브 파일을 합쳐 시간순 목록을 만든다(파일은 이름으로 짝지음)
  const used=new Set(),byName={},items=[];
  files.forEach(f=>(byName[f.name]=byName[f.name]||[]).push(f));
  for(const m of chatMsgs){
    if(m.kind==='file'){
      const f=(byName[m.name]||[]).find(x=>!used.has(x.id));
      if(f){used.add(f.id);items.push({t:m.t,kind:'file',f,sender:m.sender})}
      else items.push({t:m.t,kind:'gone',name:m.name,sender:m.sender});
    }else items.push(m);
  }
  for(const f of files)if(!used.has(f.id))items.push({t:new Date(f.createdTime).getTime(),kind:'file',f,sender:f.path||'파일'});
  items.sort((a,b)=>a.t-b.t);
  let lastDay='';
  const mk=(it,inner,cls)=>{
    const me=SELF_NAMES.includes(it.sender);
    const m=document.createElement('div');m.className='msg'+(me?' me':'');
    m.innerHTML=(me?'':`<div class="avatar">${it.kind==='text'?'💬':'📂'}</div>`)+`<div class="col">${me?'':'<div class="who"></div>'}<div class="row"><div class="bubble ${cls||''}"></div><div class="time"></div></div></div>`;
    if(!me)m.querySelector('.who').textContent=it.sender||'';
    m.querySelector('.bubble').appendChild(inner);
    m.querySelector('.time').textContent=new Date(it.t).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
    return m;
  };
  for(const it of items){
    const day=new Date(it.t).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
    if(day!==lastDay){const e=document.createElement('div');e.className='date';e.textContent=day;L.appendChild(e);lastDay=day}
    if(it.kind==='sys'){const e=document.createElement('div');e.className='sysmsg';e.textContent=it.text;L.appendChild(e);continue}
    if(it.kind==='text'){const d=document.createElement('div');d.textContent=it.text;L.appendChild(mk(it,d,'text'));continue}
    if(it.kind==='gone'){
      const d=document.createElement('div');
      d.innerHTML='<div class="fname"></div><div class="meta">파일을 찾을 수 없음(기간 만료 또는 아직 올라오지 않음)</div>';
      d.querySelector('.fname').textContent=ICON(it.name)+' '+it.name;L.appendChild(mk(it,d,'gone'));continue;
    }
    const f=it.f,isSaved=saved[f.id]===f.modifiedTime;
    const d=document.createElement('div');
    d.innerHTML='<div class="fname"></div><div class="meta"></div>';
    d.querySelector('.fname').textContent=ICON(f.name)+' '+f.name;
    const pg=prog[f.id];
    d.querySelector('.meta').innerHTML=(sizeText(f.size)||'')+`<span class="badge ${isSaved?'ok':'no'}" id="bd-${f.id}">${pg!=null?`다운로드 중 ${pg}%`:(isSaved?'저장됨':'아직 안 받음')}</span>`;
    const m=mk(it,d);m.querySelector('.bubble').onclick=()=>openFile(f);L.appendChild(m);
  }
  if(nearBottom)window.scrollTo(0,document.body.scrollHeight);else window.scrollTo(0,keepY);
  firstRender=false;
  const todo=files.filter(f=>saved[f.id]!==f.modifiedTime).length;
  $('#btnAll').textContent=todo?`새 파일 ${todo}개 받기`:'모두 저장됨';
  $('#btnAll').disabled=!todo||!token;
  $('#btnRef').style.display='inline-block';$('#btnAll').style.display='inline-block';
}

// ---------- 받기/열기 ----------
// 받는 중인 파일의 진행률(0~100). 목록과 열기 화면이 이 값을 보여 준다.
const prog={};
function showProgress(id,p){
  prog[id]=p;
  const b=document.getElementById('bd-'+id);if(b)b.textContent=`다운로드 중 ${p}%`;
  const v=document.getElementById('vprog');if(v)v.textContent=`다운로드 중 ${p}%`;
}
async function getBlob(f){
  const c=await dbGet(f.id);
  if(c&&c.mtime===f.modifiedTime)return c.blob;
  if(!token)throw new Error('offline');
  const native=f.mimeType.startsWith('application/vnd.google-apps');
  const r=native?await api(`files/${f.id}/export`,{mimeType:'application/pdf'}):await api(`files/${f.id}`,{alt:'media'});
  // 전체 크기를 알면 조금씩 읽으면서 퍼센트를 올린다(구글 문서 변환처럼 크기를 모르면 한꺼번에 받는다)
  const total=+r.headers.get('Content-Length')||(native?0:+f.size||0);
  let blob;
  if(r.body&&total){
    const reader=r.body.getReader(),chunks=[];let got=0,last=-1;
    showProgress(f.id,0);
    for(;;){
      const {done,value}=await reader.read();
      if(done)break;
      chunks.push(value);got+=value.length;
      const p=Math.min(100,Math.floor(got*100/total));
      if(p!==last){last=p;showProgress(f.id,p)}
    }
    blob=new Blob(chunks,{type:r.headers.get('Content-Type')||''});
  }else{
    blob=await r.blob();
  }
  await dbPut(f.id,{blob,mtime:f.modifiedTime,name:f.name});
  delete prog[f.id];
  return blob;
}
const MIME={hwp:'application/x-hwp',hwpx:'application/vnd.hancom.hwpx',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',zip:'application/zip',txt:'text/plain'};
const mimeOf=(name,blob)=>MIME[(name.split('.').pop()||'').toLowerCase()]||blob.type||'application/octet-stream';
function showAction(msg,label,fn){
  const s=$('#status');s.textContent=msg+' ';
  const b=document.createElement('button');b.textContent=label;b.className='primary';b.style.marginLeft='6px';
  b.onclick=()=>{fn();setStatus('')};s.appendChild(b);
}
const VIEWABLE=n=>/\.(pdf|jpe?g|png|gif|webp|heic|mp4|mov|m4v|webm)$/i.test(n);
function saveToDevice(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000);
}
async function openFile(f){
  // 앱 안에서 볼 수 없는 형식(한글 등)은 중간 화면 없이 바로 기기로 받는다 -> 닫는 단계가 줄어든다. 안 되면 아래의 기존 화면으로 넘어간다.
  if(!VIEWABLE(f.name)&&!f.mimeType.startsWith('application/vnd.google-apps')){
    try{
      const b=await getBlob(f);
      const file=new File([b],f.name,{type:mimeOf(f.name,b)});
      // 1) 바로 공유 창을 띄운다(한컴 뷰어 등). 형식을 정확히 알려줘야 공유 목록에 해당 앱이 나온다.
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:f.name});render();return}
        catch(err){
          if(err&&err.name==='AbortError'){
            showAction('공유 창을 닫았습니다. 목록에 한컴이 없으면 →','기기로 받기',()=>saveToDevice(file,f.name));render();return;
          }
        }
      }
      // 2) 공유를 못 쓰면 기기로 받기
      saveToDevice(file,f.name);
      setStatus(f.name+' 을(를) 받았습니다. 사파리 주소창 옆 다운로드(↓) 표시에서 열어 주세요.');render();return;
    }catch(e){/* 받기에 실패하면 아래 화면으로 */}
  }
  $('#viewer').classList.add('on');$('#vtitle').textContent=f.name;
  const B=$('#vbody');
  // 이미 기기에 저장된 파일은 바로 열리고, 처음 여는 파일은 받는 동안 안내를 띄운다
  const cached=saved[f.id]===f.modifiedTime;
  B.innerHTML=cached?'<div class="other">불러오는 중…</div>':'<div class="other"><span id="vprog">다운로드 중 0%</span><br><small>한 번만 받으면 다음부터는 바로 재생됩니다. 받은 파일은 이 앱 안에 저장됩니다.</small></div>';
  let blob;
  try{blob=await getBlob(f)}catch(e){
    B.innerHTML='<div class="other">이 파일은 아직 이 기기에 저장되지 않았고, 지금은 받을 수 없습니다.<br>인터넷이 되는 곳에서 한 번 열어 두세요.</div>';return;
  }
  render();
  const n=f.name.toLowerCase();B.innerHTML='';
  try{
    if(/\.pdf$/.test(n)||f.mimeType.startsWith('application/vnd.google-apps')){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
      const w=Math.min(B.clientWidth||800,1000),dpr=Math.min(window.devicePixelRatio||1,2);
      for(let p=1;p<=pdf.numPages;p++){
        const pg=await pdf.getPage(p),v0=pg.getViewport({scale:1}),sc=w/v0.width,v=pg.getViewport({scale:sc*dpr});
        const cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;cv.style.width=w+'px';
        B.appendChild(cv);await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;
      }
    }else if(/\.(jpe?g|png|gif|webp|heic)$/.test(n)||blob.type.startsWith('image/')){
      const i=new Image();i.src=URL.createObjectURL(blob);B.appendChild(i);
    }else if(/\.(mp4|mov|m4v|webm)$/.test(n)||blob.type.startsWith('video/')){
      const v=document.createElement('video');v.controls=true;v.playsInline=true;v.src=URL.createObjectURL(blob);B.appendChild(v);
    }else{throw new Error('other')}
  }catch(e){
    const a=document.createElement('a');a.className='dl';a.textContent='원본 받기 / 다른 앱으로 열기';
    a.href=URL.createObjectURL(blob);a.download=f.name;
    const d=document.createElement('div');d.className='other';
    d.innerHTML='이 형식은 앱 안에서 바로 볼 수 없습니다.<br>';
    // 아이패드/갤럭시탭의 공유 시트로 한컴 뷰어 등 설치된 앱에 바로 넘긴다(지원되는 경우만 버튼 표시)
    try{
      const file=new File([blob],f.name,{type:mimeOf(f.name,blob)});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        const b=document.createElement('button');b.className='primary';b.textContent='다른 앱으로 열기 (공유)';
        b.style.cssText='display:block;margin:16px auto 0;font-size:16px;padding:12px 22px';
        b.onclick=()=>navigator.share({files:[file],title:f.name}).catch(()=>{});
        d.appendChild(b);
      }
    }catch(_){}
    d.appendChild(a);B.innerHTML='';B.appendChild(d);
  }
}
$('#vclose').onclick=()=>{$('#viewer').classList.remove('on');$('#vbody').innerHTML=''};

$('#btnRef').onclick=()=>{if(token)refresh();else render()};
$('#btnAll').onclick=async()=>{
  const todo=files.filter(f=>saved[f.id]!==f.modifiedTime);let n=0,skip=0;
  for(const f of todo){
    if(+f.size>MAX_AUTO){skip++;continue}
    setStatus(`받는 중… ${++n}/${todo.length-skip}  ${f.name}`);
    try{await getBlob(f)}catch(e){setStatus('받기 실패: '+f.name);break}
    delete prog[f.id];
  }
  setStatus(skip?`${skip}개는 용량이 커서 건너뜀(눌러서 개별로 받으세요)`:'');
  await render();
};

// ---------- 자동 새로고침 / 맨 아래에서 위로 당겨 새로고침 ----------
async function autoRefresh(){
  if(!token||Date.now()>=tokenExp||!navigator.onLine||window.__busy)return;
  window.__busy=1;try{await refresh()}finally{window.__busy=0}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoRefresh()});
setInterval(()=>{if(document.visibilityState==='visible')autoRefresh()},90000);
let ty0=0,atBottom=false;
addEventListener('touchstart',e=>{ty0=e.touches[0].clientY;atBottom=(innerHeight+scrollY>=document.body.scrollHeight-5)},{passive:true});
addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-ty0;
  if(atBottom&&dy<-80&&!$('#viewer').classList.contains('on')){setStatus('새로고침 중…');autoRefresh()}
},{passive:true});

// ---------- 시작 ----------
if('serviceWorker' in navigator){
  const hadCtl=!!navigator.serviceWorker.controller;
  // 새 버전의 저장 장치가 켜지면(이전 버전이 있던 경우만) 한 번 새로고침해서 최신 화면으로 바꾼다
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!window.__rl){window.__rl=1;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(reg=>reg.update()).catch(()=>{});
}
(async function(){
  await loadSaved();
  try{files=JSON.parse(localStorage.getItem('ka_list')||'[]')}catch(e){files=[]}
  try{chatMsgs=JSON.parse(localStorage.getItem('ka_chat')||'[]')}catch(e){chatMsgs=[]}
  if(files.length||chatMsgs.length)await render();
  if(loadToken()){$('#btnRef').style.display='inline-block';refresh();return}
  // GIS 스크립트가 늦게 올 수 있어 잠시 기다림
  let t=0;const iv=setInterval(()=>{
    if(initAuth()||++t>20){clearInterval(iv);
      if(!token){
        if(!navigator.onLine){ $('#login').style.display=files.length?'none':'block';
          if(files.length)setStatus('오프라인: 저장된 파일만 열 수 있습니다.'); }
        else{
          // 전에 로그인한 적이 있으면 로그인 창 없이 조용히 새 토큰을 요청(2단계 인증 없이 이어지는 경우가 대부분). 안 되면 버튼 표시.
          let was=false;try{was=!!localStorage.getItem('ka_signed')}catch(e){}
          if(was&&tc){try{tc.requestAccessToken({prompt:''})}catch(e){$('#login').style.display='block'}}
          else $('#login').style.display='block';
        }
      }}
  },300);
})();
</script>
